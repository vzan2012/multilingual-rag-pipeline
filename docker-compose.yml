version: "3.8"

services:
  chromadb:
    image: "chromadb/chroma:latest"
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=true
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMOUS_TELEMETRY=false
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
